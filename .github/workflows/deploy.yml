# .github/workflows/deploy.yml
name: Continuous Deployment

# This workflow runs ONLY when code is pushed to the 'main' branch.
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Environment (Adjust Node version/package manager as needed)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      # 3. Install Dependencies and Build (The validation step)
      - name: Install Dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            corepack prepare pnpm@latest --activate
            pnpm install
          else
            npm install
          fi
      
      - name: Build Project
        run: npm run build

      # 4. Deploy to Vercel (The production step)
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_91mlvKerpS9UcO9SycH4uVKg
          vercel-project-id: prj_3tRUkePRPwmFMEpJJwtA9jt2hOU3
          # alias-domains: vesselsurge.com

      # 5. Post-Deployment Confirmation
      - name: Deployment Success Confirmation
        run: echo "✅ SUCCESS: Vercel deployment successful!"
